<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Preview - Analytics</title>
  <link rel="stylesheet" href="theme-vars.css">
  <link rel="stylesheet" href="content.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div class="header-title">
  <h1>Analytics</h1>
  <p>Environmental and irrigation trends across your farms this week.</p>
</div>

<div class="charts-grid">

  
  <div class="card chart-card">
    <div class="chart-header">
      <div>
        <h2>Soil Moisture</h2>
        <p class="card-subtitle">Average moisture level (%)</p>
      </div>
    </div>
    <div class="chart-body">
      <canvas id="soilChart" height="180"></canvas>
    </div>
  </div>

  
  <div class="card chart-card">
    <div class="chart-header">
      <div>
        <h2>Temperature & Humidity</h2>
        <p class="card-subtitle">Daily readings</p>
      </div>
    </div>
    <div class="chart-body">
      <canvas id="tempChart" height="180"></canvas>
    </div>
  </div>


  <div class="card chart-card">
    <div class="chart-header">
      <div>
        <h2>Water Usage</h2>
        <p class="card-subtitle">Irrigation volume (L/m²)</p>
      </div>
    </div>
    <div class="chart-body">
      <canvas id="waterChart" height="180"></canvas>
    </div>
  </div>

  
  <div class="card chart-card">
    <div class="chart-header">
      <div>
        <h2>Crop Health</h2>
        <p class="card-subtitle">Distribution across all zones</p>
      </div>
    </div>
    <div class="chart-body donut-with-legend">
      <canvas id="healthChart" height="180"></canvas>
      <ul class="health-legend">
        <li class="health-legend-item">
          <span class="legend-label"><span class="dot" style="background:#22c55e;"></span>Healthy</span>
          <strong>62%</strong>
        </li>
        <li class="health-legend-item">
          <span class="legend-label"><span class="dot" style="background:#eab308;"></span>Needs Attention</span>
          <strong>28%</strong>
        </li>
        <li class="health-legend-item">
          <span class="legend-label"><span class="dot" style="background:#ef4444;"></span>Critical</span>
          <strong>10%</strong>
        </li>
      </ul>
    </div>
  </div>

</div>

<script src="analytics.js"></script>
</body>
</html>
