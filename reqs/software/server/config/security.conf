#                              --- Code Description ---                            #
#       This configuration file enhances the security of the Apache server by      #
# implementing various security measures. It restricts access to sensitive files,  #
#  directories, and server information. It also sets limits on request sizes and   #
# timeouts to mitigate potential attacks. Additionally, it configures logging for  #
#                          monitoring and auditing purposes.                       #
# ================================================================================ #

ServerTokens Prod
ServerSignature Off
TraceEnable Off
FileETag None

RequestReadTimeout header=20-40,MinRate=500 body=20,MinRate=500

LimitRequestLine 8190
LimitRequestFields 100
LimitRequestFieldSize 8190
LimitRequestBody 10485760

<Directory />
    AllowOverride None
    Require all denied
</Directory>

<Directory /var/www>
    AllowOverride None
    Require all denied
</Directory>

<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride FileInfo Options
    Require all granted
</Directory>

<Directory /var/www/env>
    AllowOverride None
    Require all denied
</Directory>

<Directory /var/www/logs>
    AllowOverride None
    Require all denied
</Directory>

<LocationMatch "^/(?:server-status|server-info)(?:/|$)">
    Require all denied
</LocationMatch>

<FilesMatch "^(?:\.env(?:\..*)?|composer\.(?:json|lock)|package(?:-lock)?\.json|Dockerfile|docker-compose(?:\.ya?ml)?|Makefile)$">
    Require all denied
</FilesMatch>

<FilesMatch "\.(?:env|ini|log|sql|bak|old|backup|zip|tar|gz|7z|rar|pem|key|crt|csr)(?:\..*)?$">
    Require all denied
</FilesMatch>

LogFormat "%a %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" ias42
