ServerName __APP_DOMAIN__

<VirtualHost *:80>
    ServerName __APP_DOMAIN__
    __APP_DOMAIN_ALIASES__
    
    DocumentRoot /var/www/html

    RewriteEngine On
    
    # Block proxy tunnel attempts
    RewriteCond %{REQUEST_METHOD} ^CONNECT$ [NC]
    RewriteRule ^ - [F,L]
    
    # Force HTTPS
    RewriteCond %{HTTPS} !=on
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog /var/www/logs/apache/http-error.log
    CustomLog /var/www/logs/apache/http-access.log combined
</VirtualHost>

SSLStrictSNIVHostCheck off

<VirtualHost *:443>
    ServerName __APP_DOMAIN__
    __APP_DOMAIN_ALIASES__
    
    DocumentRoot /var/www/html

    SSLEngine on
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLCipherSuite ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA384
    SSLHonorCipherOrder on

    SSLCertificateFile /etc/apache2/ssl/certs/server.crt
    SSLCertificateKeyFile /etc/apache2/ssl/private/server.key

    <IfModule mod_headers.c>
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-Frame-Options "SAMEORIGIN"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
        Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
        Header always set Content-Security-Policy "frame-ancestors 'self';"
        Header always set Strict-Transport-Security "max-age=86400"
    </IfModule>

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog /var/www/logs/apache/https-error.log
    CustomLog /var/www/logs/apache/https-access.log combined
</VirtualHost>
